name: 🔌 Diagnostic conectivitate surse

"on":
  push:
    branches: ['diag/**']

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Teste
        run: |
          set +e
          {
          echo "IP runner: $(curl -s -m 10 https://api.ipify.org)"
          for i in 1 2; do
            curl -sS -m 20 -o /dev/null -w "data.gov.ro https %{http_code} %{time_total}s\n" "https://data.gov.ro/api/3/action/package_show?id=achizitii-publice-2026" 2>&1
            curl -sS -m 20 -o /dev/null -w "data.gov.ro http %{http_code} %{time_total}s\n" "http://data.gov.ro/" 2>&1
            curl -sS -m 25 -X POST -H "Content-Type: application/json;charset=UTF-8" -H "Referer: https://e-licitatie.ro/pub/direct-acquisitions/list/1" -H "Origin: https://e-licitatie.ro" \
              -d '{"pageSize":3,"pageIndex":0,"showOngoingDa":false,"contractingAuthorityId":null,"supplierId":124356,"publicationDateStart":"2026-01-01T00:00:00.000Z","publicationDateEnd":"2026-09-30T00:00:00.000Z"}' \
              -o /tmp/r.json -w "SEAP API %{http_code} %{time_total}s " "https://e-licitatie.ro/api-pub/DirectAcquisitionCommon/GetDirectAcquisitionList/" 2>&1; head -c 160 /tmp/r.json; echo
            curl -sS -m 20 -o /dev/null -w "SEAP view %{http_code} %{time_total}s\n" -H "Referer: https://e-licitatie.ro/pub" "https://e-licitatie.ro/api-pub/PublicDirectAcquisition/getView/118853764" 2>&1
            sleep 10
          done
          } > "diag2_${{ matrix.n }}.txt" 2>&1
          cat "diag2_${{ matrix.n }}.txt"
      - name: Salvez
        run: |
          git config user.email "diag@transparenta-pantelimon.eu"; git config user.name "diag"
          git add diag2_*.txt; git commit -m "diag ${{ matrix.n }} [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 10 + 3)); done
