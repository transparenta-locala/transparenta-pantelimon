name: 🔌 Diagnostic conectivitate surse

"on":
  push:
    branches: ['diag/**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        n: [1, 2, 3, 4]
    steps:
      - run: pip install requests
      - name: Teste
        run: |
          echo "IP runner: $(curl -s -m 10 https://api.ipify.org)"
          for i in 1 2 3; do
            curl -sS -m 25 -o /dev/null -w "curl %{http_code} %{time_total}s\n" "https://data.gov.ro/api/3/action/package_show?id=achizitii-publice-2026" 2>&1
            python - <<'PY'
          import requests, time
          H = {"User-Agent": "Mozilla/5.0 (compatible; MonitorCivic/1.0; civic transparency)", "Accept": "application/json, text/html", "Content-Type": "application/json"}
          for nume, h in (("monitor-headers", H), ("fara-headers", {})):
              t = time.time()
              try:
                  r = requests.get("https://data.gov.ro/api/3/action/package_show?id=achizitii-publice-2026", timeout=(15, 30), headers=h)
                  print(nume, r.status_code, f"{time.time()-t:.1f}s")
              except Exception as e:
                  print(nume, "EROARE", type(e).__name__, f"{time.time()-t:.1f}s")
          PY
            sleep 20
          done
