name: 🚩 Monitor Transparență Pantelimon

"on":
  schedule:
    # Pe 1 și pe 15 ale lunii, la 05:17 UTC (≈ 08:17 ora României; minut „impar”
    # ca să evităm aglomerarea de la ora fixă, când GitHub întârzie rulările).
    # Monitorul rulează DOAR aici, nu de pe PC (rularea programată de pe PC a făcut
    # un force-push pe 01.10.2026 care a șters din main modificări publicate).
    # Contractele vin din API-ul public SEAP (sursa_seap_api.py): o cerere la 2 s, ~45 de cereri
    - cron: '17 5 1,15 * *'
  workflow_dispatch:  # permite și pornire manuală din GitHub
  # Când se schimbă codul care generează paginile, site-ul se regenerează singur
  # (altfel noul aspect ar apărea abia la rularea programată din 1 sau 15).
  push:
    branches: [main]
    paths:
      - monitor_pantelimon.py
      - genereaza_previzualizari.py
      - logo_tp.py
      - sursa_seap_api.py
      - risc_firma.py
      - .github/workflows/update-report.yml

# O singură rulare a monitorului odată (o pornire manuală peste cea programată așteaptă)
concurrency:
  group: monitor-transparenta
  cancel-in-progress: false

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # necesar pentru commit înapoi în repo

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐍 Configurare Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 🔧 Instalare Tesseract OCR + Poppler
        # apt-get update: fără el, pe runnerele noi instalarea cădea (index de pachete vechi, 26.10.2026).
        # OCR-ul e opțional pentru monitor — dacă tot nu se instalează, analiza merge mai departe.
        run: |
          sudo apt-get update -q || true
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ron poppler-utils || echo "::warning::Tesseract/Poppler neinstalate — HCL fără OCR la această rulare"

      - name: 📦 Instalare dependențe Python
        run: pip install -r requirements.txt pdf2image

      - name: 🧱 Minificare enhance.js (enhance.min.js e cel încărcat de pagini)
        run: npx --yes terser@5.31.6 enhance.js --compress --mangle --comments '/^!/' -o enhance.min.js

      - name: 🏦 Date financiare ANAF (cel mai recent an publicat pe data.gov.ro)
        # Anul se găsește singur prin API-ul data.gov.ro (înainte era scris fix „2024”, așa că
        # situațiile pe 2025, publicate în oct. 2026, n-ar fi fost preluate niciodată).
        # O cerere la API când nu e nimic nou; descărcare (~90 MB, cu reluare) doar la an nou.
        # Rulează ÎNAINTE de monitor, ca raportul și fișele să folosească datele noi chiar acum.
        run: python import_financiar_datagov.py --auto || echo "::warning::Import ANAF eșuat — datele financiare rămân cele existente"

      - name: 🔍 Rulare monitor transparență
        # ANAF v9 e gratuit și fără cheie API; openapi.ro key e opțional (not required)
        run: python monitor_pantelimon.py

      - name: 🗺️ Geocodare firme furnizoare (ANAF v9 + Nominatim)
        run: python geocodeaza_acum.py 2>/dev/null || echo "geocodare skipped"

      - name: 🔗 Analiză rețele firme (adrese comune)
        # Detectează firme cu adresă fiscală comună din firme_geocoded.json
        # Output: retele_firme.json — citit de monitor_pantelimon.py pentru paginile furnizori
        run: python analizeaza_retele.py 2>/dev/null || echo "analiza retele skipped"

      - name: 🏢 Enrichment CUI firme (cross-reference, fără mfinante)
        # mfinante.gov.ro URL-ul static a căzut în mai 2026 — skip fetch financiar
        # Rulăm cu --no-mfinante pentru cross-referencing CUI din firme_geocoded.json
        run: NO_MFINANTE=1 python enricheaza_firme.py 2>/dev/null || echo "enrichment skipped"

      - name: 📰 Monitorizare presă automată (Google News + Context.ro)
        # Cache SQLite TTL 7 zile → re-fetch la fiecare rulare săptămânală
        # Rate limit 1.2s/request; max 20 articole per firmă per sursă
        # Output: mentiuni_presa_auto.json — citit de monitor_pantelimon.py pentru flaguri
        run: python monitorizare_presa.py 2>/dev/null || echo "monitorizare presa skipped"


      - name: Generare analiza AI Gemini (gratuit - zero cost)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python genereaza_analiza_ai.py 2>&1 || echo 'AI skipped (no key)'
      - name: 💾 Commit raport actualizat
        run: |
          git config --local user.email "transparenta-bot@cetatenipantelimon.ro"
          git config --local user.name "Monitor Transparență Cetățenesc Pantelimon"
          # fix: adăugăm fiecare fișier separat cu || true (unele pot lipsi)
          git add raport_transparenta.html 2>/dev/null || true
          git add index.html 2>/dev/null || true
          git add transparenta_pantelimon.html 2>/dev/null || true
          git add stare_anterioara.json 2>/dev/null || true
          git add contracte.json 2>/dev/null || true
          git add delta.json 2>/dev/null || true
          git add cache_firme.json 2>/dev/null || true
          git add feed.xml 2>/dev/null || true
          git add furnizori/ 2>/dev/null || true
          git add raport.json 2>/dev/null || true
          git add istoric_scor.json 2>/dev/null || true
          git add press_kit.json 2>/dev/null || true
          git add firme_geocoded.json 2>/dev/null || true
          git add firme_financiar.json 2>/dev/null || true
          git add mentiuni_presa_auto.json 2>/dev/null || true
          git add retele_firme.json 2>/dev/null || true
          git add retele.html 2>/dev/null || true
          git add analiza_ai.json 2>/dev/null || true
          git add genereaza_analiza_ai.py 2>/dev/null || true
          git add og-image.png 2>/dev/null || true
          git add sitemap.xml 2>/dev/null || true
          git add contracte.csv 2>/dev/null || true
          git add press_kit.md 2>/dev/null || true
          git add pnrr_projects.json 2>/dev/null || true
          git add curtea_de_conturi.json 2>/dev/null || true
          git add ani_declaratii.json 2>/dev/null || true
          git add ted_notices.json 2>/dev/null || true
          git add mol_primarie.json 2>/dev/null || true
          # Previzualizări de partajare (genereaza_previzualizari.py, apelat din monitor)
          git add og/ semnale/ 2>/dev/null || true
          # Cadrul comun (meniu, bandă de date, subsol) e scris în TOATE paginile, și în cele statice
          git add ./*.html enhance.min.js 2>/dev/null || true
          # Commit doar dacă există modificări
          git diff --staged --quiet || git commit -m "🚩 Raport actualizat $(date +'%d.%m.%Y')"
          # Curăță fișiere neadăugate (ex. __pycache__, tmp) care ar bloca rebase-ul
          git checkout -- . 2>/dev/null || true
          git clean -fd 2>/dev/null || true
          # Rebase pe ramura rulării (main la rularea programată; o ramură de probă la
          # pornirea manuală pe ramură) — checkout-ul e superficial, iar un rebase pe main
          # dintr-o altă ramură dădea conflicte add/add pe toate fișierele.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"


